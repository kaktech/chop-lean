<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chop Lean — Cart (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=DM+Serif+Display:ital@0;1&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap">
<style>body{margin:0;background:#F7F6F1}a{color:#3D6B1F}a:hover{color:#24421A}*{-webkit-tap-highlight-color:transparent}.cl-scroll{scrollbar-width:none}.cl-scroll::-webkit-scrollbar{display:none}@keyframes clUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes clIn{from{opacity:0}to{opacity:1}}@keyframes clFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes clSpin{to{transform:rotate(360deg)}}@keyframes clMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}@keyframes clToast{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}@keyframes clDrawer{from{transform:translateX(100%)}to{transform:none}}@keyframes clSheet{from{transform:translateY(100%)}to{transform:none}}@keyframes clPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}@keyframes clReveal{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}@keyframes clWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}.cl-up{animation:clUp .9s cubic-bezier(.2,.7,.2,1) both}.cl-d1{animation-delay:.08s}.cl-d2{animation-delay:.18s}.cl-d3{animation-delay:.3s}.cl-d4{animation-delay:.44s}.cl-d5{animation-delay:.6s}.cl-float{animation:clFloat 5s ease-in-out infinite}.cl-float2{animation:clFloat 6.5s ease-in-out infinite;animation-delay:-2s}.cl-spin{animation:clSpin 18s linear infinite}.cl-marquee{animation:clMarquee 38s linear infinite}.cl-marquee:hover{animation-play-state:paused}.cl-wipe{animation:clWipe 1.2s cubic-bezier(.7,0,.2,1) .1s both}.cl-toast{animation:clToast .45s cubic-bezier(.2,.9,.3,1.2) both}.cl-drawer{animation:clDrawer .5s cubic-bezier(.2,.8,.2,1) both}.cl-sheet{animation:clSheet .5s cubic-bezier(.2,.8,.2,1) both}.cl-fade{animation:clIn .3s ease both}.cl-pop{animation:clPop .5s ease both}.cl-lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}.cl-lift:hover{transform:translateY(-6px);box-shadow:0 26px 44px rgba(21,32,26,.13)}.cl-zoom{overflow:hidden}.cl-zoom img{transition:transform .7s cubic-bezier(.2,.7,.2,1)}.cl-zoom:hover img{transform:scale(1.07)}.cl-btn{transition:transform .2s,box-shadow .2s,background-color .2s}.cl-btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(21,32,26,.18)}.cl-btn:active{transform:translateY(0) scale(.98)}.cl-reveal{animation:clReveal .9s cubic-bezier(.2,.7,.2,1) both}@supports (animation-timeline: view()){.cl-reveal{animation:clReveal linear both;animation-timeline:view();animation-range:entry 0% cover 28%}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'DM Sans', sans-serif; color: #15201A; background: #F7F6F1;">
  <img src="../public/images/ofada.jpg" alt="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(2px);">
  <a href="MProduct.dc.html" aria-label="Close cart" class="cl-fade" style="position: absolute; inset: 0; background: rgba(21,32,26,0.55);"></a>
  <section class="cl-sheet" aria-label="Cart" style="position: absolute; left: 0; right: 0; bottom: 0; height: 700px; background: #F7F6F1; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; box-shadow: 0 -20px 40px rgba(0,0,0,0.2);">
    <span aria-hidden="true" style="width: 44px; height: 5px; border-radius: 999px; background: #D6D3C8; align-self: center; margin-top: 10px;"></span>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 10px;"><h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 26px;">Your cart <span style="font-size: 16px; color: #5B6560; font-weight: 500;">(2)</span></h1><a href="MProduct.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E6E4DC; display: flex; align-items: center; justify-content: center; color: #15201A; text-decoration: none;">✕</a></div>
    <div style="flex-grow: 1; overflow: auto; padding: 4px 18px; display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="2">
        <div class="cl-up" style="display: flex; gap: 12px; align-items: center; background: #FFFFFF; border: 1px solid #E6E4DC; border-radius: 18px; padding: 10px;">
          <img src="{{it.img}}" alt="" style="width: 72px; height: 72px; border-radius: 12px; object-fit: cover;">
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;"><b style="font-family: 'Outfit', sans-serif; font-size: 16px;">{{it.name}}</b><span style="font-size: 12px; color: #5B6560;">{{it.opts}}</span><b style="font-size: 14px;">{{it.price}}</b></span>
          <span style="display: flex; flex-direction: column; align-items: center; border: 1px solid #D6D3C8; border-radius: 999px;"><button type="button" aria-label="Increase" style="width: 36px; height: 32px; border: 0; background: transparent;">+</button><b style="font-size: 13px;">1</b><button type="button" aria-label="Decrease" style="width: 36px; height: 32px; border: 0; background: transparent;">−</button></span>
        </div>
      </sc-for>
      <div style="display: flex; gap: 12px; align-items: center; background: #FCEBC9; border-radius: 18px; padding: 10px;">
        <img src="../public/images/tiger-nut.jpg" alt="" style="width: 56px; height: 56px; border-radius: 12px; object-fit: cover;">
        <span style="flex-grow: 1; font-size: 13px;"><b style="display: block; font-size: 14px;">Add tiger nut drink?</b>140 kcal · ₦1,800</span>
        <button type="button" class="cl-btn" style="font: inherit; font-weight: 700; font-size: 13px; background: #15201A; color: #FFFFFF; border: 0; border-radius: 999px; padding: 10px 14px;">+ Add</button>
      </div>
      <div style="display: flex; gap: 8px;"><label for="mpromo" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Promo code</label><input id="mpromo" type="text" placeholder="Promo code" style="flex-grow: 1; min-width: 0; font: inherit; font-size: 14px; padding: 12px; border-radius: 12px; border: 1px solid #D6D3C8;"><button type="button" style="font: inherit; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; background: #15201A; color: #FFFFFF; border: 0; border-radius: 12px; padding: 0 16px;">APPLY</button></div>
    </div>
    <div style="background: #FFFFFF; border-top: 1px solid #E6E4DC; padding: 14px 18px 22px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; font-size: 14px;"><span style="color: #5B6560;">Subtotal</span><b style="font-family: 'Outfit', sans-serif; font-size: 22px;">₦59,700</b></div>
      <span style="font-size: 12px; color: #5B6560;">Delivery calculated at checkout · ≈ 7,000 kcal this week</span>
      <a class="cl-btn" href="MCheckout.dc.html" style="background: #15201A; color: #FFFFFF; font-weight: 700; font-size: 14px; letter-spacing: 0.12em; text-align: center; padding: 17px; border-radius: 14px; text-decoration: none;">CHECKOUT</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    return { items: [
      { name: 'Naija Lean 1400', opts: '3 meals · 5 days · No pork', price: '₦52,500', img: '../public/images/ofada.jpg' },
      { name: 'Zero-sugar zobo ×6', opts: '35cl bottles', price: '₦7,200', img: '../public/images/zobo.jpg' }
    ] };
  }
}
</script>
</body>
</html>
